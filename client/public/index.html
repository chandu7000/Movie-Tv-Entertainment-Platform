<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/cineverse-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Discover movies and TV shows, watch trailers, build watchlists, save favorites, rate titles, and get personalized recommendations with CineVerse." />
    <meta name="application-name" content="CineVerse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CineVerse" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>CineVerse | Movies & TV</title>
    <style>
      #cineverse-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(220, 38, 38, 0.18), transparent 34%),
          #050505;
        transition: opacity 420ms ease, visibility 420ms ease;
      }
      #cineverse-splash.cineverse-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .cineverse-splash-content {
        width: min(88vw, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      .cineverse-splash-logo {
        width: clamp(150px, 42vw, 230px);
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 50%;
        filter: drop-shadow(0 0 28px rgba(239, 68, 68, 0.28));
      }
      .cineverse-splash-title {
        margin-top: 16px;
        font-size: clamp(32px, 8vw, 48px);
        font-weight: 900;
        font-style: italic;
        letter-spacing: -1.5px;
      }
      .cineverse-splash-title span {
        color: #ef4444;
      }
      .cineverse-splash-subtitle {
        margin-top: 5px;
        color: #d4d4d4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .cineverse-splash-loader {
        width: min(62vw, 230px);
        height: 6px;
        margin-top: 48px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,0.16);
      }
      .cineverse-splash-loader::after {
        content: '';
        display: block;
        width: 48%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #dc2626, #ef4444, #fb7185);
        animation: cineverseLoading 1.1s ease-in-out infinite alternate;
      }
      @keyframes cineverseLoading {
        from { transform: translateX(0); }
        to { transform: translateX(108%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #cineverse-splash { transition: none; }
        .cineverse-splash-loader::after { animation: none; width: 70%; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CineVerse.</noscript>

    <div id="cineverse-splash" role="status" aria-label="CineVerse is starting">
      <div class="cineverse-splash-content">
        <img class="cineverse-splash-logo" src="%PUBLIC_URL%/cineverse-logo.png" alt="CineVerse" />
        <div class="cineverse-splash-title">Cine<span>Verse</span></div>
        <div class="cineverse-splash-subtitle">Movies &nbsp;•&nbsp; TV Shows &nbsp;•&nbsp; Trailers</div>
        <div class="cineverse-splash-loader" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root"></div>
  </body>
</html>
